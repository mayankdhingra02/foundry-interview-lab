name: Verify application
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Docker Official Images via the verified Docker publisher on ECR Public.
# Tag manifests were checked 2026-10-09; digests make CI provisioning repeatable.
# Production Dockerfile/runtime defaults remain unchanged.
env:
  CI_PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
  CI_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
  CI_NODE_IMAGE: public.ecr.aws/docker/library/node:24-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
  CI_DOCKER_CLI_IMAGE: public.ecr.aws/docker/library/docker:29-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  isolated-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Deliberate CI image provisioning; learner execution never pulls images.
      - name: Provision reviewed qualification images
        run: |
          provision() {
            local source="$1" target="$2"
            if ! docker image inspect "$source" > /dev/null 2>&1; then docker pull "$source"; fi
            docker image tag "$source" "$target"
            docker image inspect --format '{{json .RepoDigests}}' "$source"
          }
          provision "$CI_PYTHON_IMAGE" python:3.11-slim
          provision "$CI_POSTGRES_IMAGE" postgres:16-alpine
          image_id="$(docker image inspect --format '{{.Id}}' "$CI_PYTHON_IMAGE")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "PYTHON_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - run: FOUNDRY_DOCKER_INTEGRATION=1 npm test -- tests/runner.test.ts
      - run: RUN_POSTGRES_INTEGRATION=1 npm test -- tests/postgres.integration.test.ts tests/billing.integration.test.ts tests/voice-postgres.integration.test.ts tests/review-postgres.integration.test.ts tests/retention-postgres.integration.test.ts tests/deleted-requests.integration.test.ts
      - run: FOUNDRY_OPERATIONS_QUALIFICATION=1 node --conditions=react-server --import tsx scripts/operations/qualify.ts --output work/operations-qualification.json
      - run: node --conditions=react-server --import tsx scripts/operations/reconcile.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-operations-qualification
          path: work/operations-qualification.json
          if-no-files-found: ignore
          retention-days: 7
  browser-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3134
      PLAYWRIGHT_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Provision reviewed browser runtime
        run: |
          if ! docker image inspect "$CI_PYTHON_IMAGE" > /dev/null 2>&1; then docker pull "$CI_PYTHON_IMAGE"; fi
          docker image tag "$CI_PYTHON_IMAGE" python:3.11-slim
          docker image inspect --format '{{json .RepoDigests}}' "$CI_PYTHON_IMAGE"
          image_id="$(docker image inspect --format '{{.Id}}' "$CI_PYTHON_IMAGE")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "PYTHON_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - name: Configure synthetic local identity without printing its secret
        run: |
          mkdir -p work
          node -e 'const fs=require("fs"),crypto=require("crypto");fs.writeFileSync(".env.local",["AUTH_MODE=local","APP_URL=http://127.0.0.1:3134","SESSION_SECRET="+crypto.randomBytes(32).toString("hex"),"PRACTICE_DATA_PATH=./work/e2e/practice.json","DATABASE_URL=","OPENAI_API_KEY=","FEATURE_AI_INTERVIEW=false","FEATURE_EXECUTION=true","FEATURE_VOICE=false","FEATURE_BILLING=false","RUNNER_MODE=docker","PYTHON_IMAGE=python:3.11-slim"].join("\n")+"\n",{mode:384})'
      - name: Start local development server
        run: |
          npm run dev -- --port 3134 > work/e2e-server.log 2>&1 &
          echo $! > work/e2e-server.pid
          curl --fail --retry 60 --retry-delay 1 --retry-all-errors http://127.0.0.1:3134/api/health > /dev/null
      - run: npm run test:e2e
      - name: Stop local server
        if: always()
        run: |
          if [ -f work/e2e-server.pid ]; then kill "$(cat work/e2e-server.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-browser-recovery
          path: test-results/
          retention-days: 7
  deployment-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Provision reviewed deployment bases
        run: |
          for source in "$CI_NODE_IMAGE" "$CI_DOCKER_CLI_IMAGE"; do
            if ! docker image inspect "$source" > /dev/null 2>&1; then docker pull "$source"; fi
            docker image inspect --format '{{json .RepoDigests}}' "$source"
          done
          if ! docker image inspect "$CI_PYTHON_IMAGE" > /dev/null 2>&1; then docker pull "$CI_PYTHON_IMAGE"; fi
          docker image tag "$CI_PYTHON_IMAGE" python:3.11-slim
          image_id="$(docker image inspect --format '{{.Id}}' "$CI_PYTHON_IMAGE")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "PYTHON_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - run: docker build --build-arg NODE_IMAGE="$CI_NODE_IMAGE" --build-arg DOCKER_CLI_IMAGE="$CI_DOCKER_CLI_IMAGE" --target web --tag foundry-lab-ops-qualification:web .
      - run: docker build --build-arg NODE_IMAGE="$CI_NODE_IMAGE" --build-arg DOCKER_CLI_IMAGE="$CI_DOCKER_CLI_IMAGE" --target worker --tag foundry-lab-ops-qualification:worker .
      - run: FOUNDRY_CONTAINER_SMOKE=1 node --conditions=react-server --import tsx scripts/operations/container-smoke.ts
